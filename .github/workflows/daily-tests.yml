name: Daily Automated Tests

on:
  schedule:
    - cron: '20 5 * * *' # Run at 05:20 UTC daily (staggered off-peak)
  workflow_dispatch: # Allow manual trigger

jobs:
  test-and-improve:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        working-directory: ./tests
        run: npm ci || npm install

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/package-lock.json') }}

      - name: Install Playwright Browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        working-directory: ./tests
        run: npx playwright install --with-deps chromium

      - name: Run test suite
        run: node tests/runner.js

      - name: Generate improvement report
        run: node tests/analyze.js

      - name: Commit test logs and report
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add logs/ reports/
          if ! git diff --quiet || ! git diff --staged --quiet; then
            git pull --rebase origin main 2>/dev/null || true
            git commit -m "chore: save daily test logs and improvement report"
            git push origin main
          fi
